ith complete Q1Q2 support mechanism","API Sameness and Complex Characterization","API PSD Determination in FDF"]},{title:"Product List",route:"product-list",iconPath:"/assets/icons/pills.svg",previewImage:de.bgDeliverables,subtitle:"Platform Technology • Patented Portfolio • Ready for Tech & Site Transfer",notePrefix:"Upon request, Please drop us a mail on ",noteEmail:"bd@abbess.in",items:["Platform Technology based Products","Patented Products","Ready for Technology Transfer","Ready for Site Transfer","Ready to RnD Accelerated Stability","Product under Development"]}]}},Xt={title:"About Us",incorporations:[{year:"2014",location:"Navi Mumbai, India",text:"ABBESS Healthcare OPC Private Limited has been incorporated on 2014 in Navi Mumbai, India."},{year:"2024",location:"Malta, Europe",text:"ABBESS Consultancy Limited has been incorporated on 2024 in Malta, Europe."}],prioritiesTitle:"Our Priorities",prioritiesText:"We have a clear goal to give patients worldwide access to innovative and affordable healthcare. Our purpose defines our quest to achieve long-term sustainable growth and deliver value to patient life.",visionSectionEyebrow:"Our Vision & Facility",visionSectionTitle:"Innovating Health, Advancing Wellness",vision:{title:"Vision",description:"To be a Leading Innovative Research and Development Organization in developing Formulating, Processes and Technologies of any dosage form and make it commercially viable for human and animal use."},facility:{title:"Facility",items:["Collaborative Research & Development facilities with CROs","Dedicated for GMP Facility for different dosage forms for product development.","Adequate scientific manpower and equipment and instrument to cater the development in almost all dosage form."]},mission:{title:"Mission",items:["To be a helping hand to Pharmaceutical, Herbal, and Neutraceutical firms by formulating niche & innovative products to reach the market on-time with a wide product portfolio.","To give patented formulations to the organizations who are engaged in high-end formulation research & development.","To develop the technology-based product for pharma and allied field.","To support healthcare industries and government in patenting our plants and parts inherited to us by our ancestors by carrying a good research in a natural /traditional system of medicines in a modernized systematic manner to handle life-threatening diseases.","To reduce the long list of difficult to formulate product of numerous discovered and clinically approved molecules by employing the right strategy and technology with scientific manpower.","Clinical support by providing our pilot GMP area to manufacture the clinical batches for pilot bioavailability and pilot bioequivalence study.","We provide end to end support solution in product development and product lifecycle management."]}},Yf={title:"Company Culture",items:["Here at ABBESS Healthcare, all the employees have the equal freedom of expression of their thoughts","On regular basis, the employees are attending seminars conferences and relevant LnD programs both on campus and our campus.","We have introduced different programs not only for the professional growth of scientists but also financial and spiritual growth.","We support employees to enroll for Ph.D. Programs, once they complete five years at AHC."]},Ho={title:"CSR Activities",items:["Each year, all the employees actively engage in a full day initiative aimed at assisting children with physically challenges and elderly individuals across various locations in India, fostering inclusivity and acre within communities.","Conduct various training programmes and do financial contributions during National Disasters.","Contributing for the health care support for the needy people, wherever possible.","ABBESS is continuously working to serve the society better and better with the passing of time.","ABBESS is supporting Police Personnel & their families by facilitating life insurance policies."],gallery:[de.csr1,de.csr2,de.csrEvent1]},Li={title:"Service",heading:"Deliverables",introParagraph:"As our objective is to help the existing pharma /healthcare organizations to reduce the development time and workload on their existing employees by getting associated with them and help in more product development and registration in the predefined time. Patenting the product and process developed by us for our clients We will be offering dedicated machines, area, and staff for potential and longterm customers. We can prepare dossiers for our clients even for highly regulated market by partnering with them. Time to time we can train our clients on advanced technologies and concepts We will be signing a two-party confidential agreement for the non-disclosure of the service offered to our client after mutually agreed upon.",dosageForms:["Formulation development: Any dosage form, from any source of medicine like Synthetic, Herbal, Neutraceuticals & Cosmetic preparations","Oral solid dosage form like a tablet, granules, capsules, dry syrups","Liquid dosage forms","Parenteral formulations","Ointments and creams"],marketsHeading:"Any market – US/ EU/ Canada/ Australia, ROW, India",marketDeliverables:["Partial development to trigger the product the registration process of ANDAs","Development by DOE and QBD","Product registration for all dosage form across the globe","Technology development for pharma and allied healthcare companies","DSIR approval to small R&D center, ensuring huge taxation benefits","IP support & NIS report for API & formulations & new technology","Complete regulatory support for drug product & drug substance","Product and process validation","Analytical method development and analytical method validation","Product technology transfer in India & overseas","Content writing of dossiers, all modules","Product registration and filing in the regulated market, semi-regulated market & in India.","Offshore CQA & QA support for plants, to upgrade their quality system","Trained opment","Nutraceuticals and Food Technology Development","Herbal Cosmetic Preparations for the Regulated Market","Lyophilized Products / Parenteral Dosage Form Development","Eye Care Products Development by New and Conventional Technology"],analyticalScopeTitle:"Analytical development Scope",analyticalScope:["Analytical method development for non-pharmacopoeial products","Analytical method development for all dosage forms of oral solid dosage (OSD) forms, including tablets, capsules, granules, complex capsules, complex modified-release (MR) tablets, creams, ointments, injections, and depot release products","Analytical method development for non-pharmaceutical products such as nutraceutical products, herbal formulations, and food products","Method validation & Equivalency studies","Timely updates of pharmacopoeia standards","Method upgrades","Regulatory Query updates"],collaborativeEyebrow:"Collaborative Project",collaborativeTitle:"High-End Research Project",collaborativeItems:["Industry-Academic Collaboration funded by DST","In collaboration with a medium scale healthcare industry, we can develop new products and processes in niche areas like Ayurceuticals and Herbaceuticals","Biosimilars & Biotechnology Products","Anticancer drugs sources: Plant derived seeds, isolation, enhancement of the active constituent, formulation and clinical trials and finally registration and commercialization."]},pf={title:"Supply Chain Management",paragraphs:["We have a dedicated team that meticulously manages all supply chain activities, ensuring efficiency and reliability at every step. Our responsibilities encompass the entire spectrum of the supply chain, beginning with the sourcing of Active Pharmaceutical Ingredients (APIs), excipients, and packaging materials. We place a strong emphasis on price control, negotiating competitive rates to maintain costeffectiveness without compromising on quality.","Additionally, our team diligently handles supply agreements for commercial supplies, ensuring that all contractual obligations are met and that there is a steady and reliable flow of materials. Through strategic planning and effective coordination, we strive to optimize our supply chain processes, mitigate risks, and deliver exceptional value to our stakeholders."],keyPillars:["Product Portfolio Management","Supply of API","Supply of Excipients","Supply of Consumables"]},Zs={title:"Business Development",intro:"Business Development Team is responsible for identification and fostering growth opportunities for an organization, which mainly includes:",operationalGoals:["Formulate strategic initiatives that align with Abbess Healthcare's goals.","Explore new market opportunities and build partnerships to expand the company’s global footprint.","Ensure efficient supply logistics and manage high-pressure situations with clear communication.","Coordinate travel plans and meetings to develop business relationships."],strategicPillars:[{label:"Strategic Planning",description:"Identifying market opportunities and creating strategies to capitalize on them."},{label:"Market Research",description:"Understanding market trends, customer needs, and competitive landscape."},{label:"Building Partnerships",description:"Developing and managing relationships with partners, clients, and stakeholders."},{label:"Sales and Marketing",description:"Supporting sales teams with strategies and tools to boost sales and market presence."},{label:"New Ventures",description:"Exploring new business avenues, such as new product lines or entering new markets."},{label:"Resource Management",description:"Ensuring that the necessary resources (Financial, Human, Technological) are available and efficiently utilized."}]},Ks={title:"Project Management",intro:"We have a dedicated Project Management Team responsible for planning, executing, and closing projects. It focuses on achieving specific goals within a set timeline and budget. Key aspects include:",phases:[{step:"01",title:"Initiation",description:"Defining the project including its objectives, scope, and stakeholders."},{step:"02",title:"Planning",description:"Developing a detailed roadmap that includes timelines, resources, budget, and risk management plans."},{step:"03",title:"Execution",description:"Implementing the project by coordinating team members, managing resources, and ensuring tasks are completed on time."},{step:"04",title:"Monitoring and Controlling",description:"Tracking the project’s progress, managing changes, and addressing any issues that arise."},{step:"05",title:"Closure",description:"Completing all project tasks, obtaining stakeholder approval, and conducting a post-project review to identify lessons learned."}]},Po={title:"QP Service",intro:"QP services play a crucial role in the pharmaceutical industry, ensuring compliance with regulatory standards and overseeing the release of medicinal products.",pillars:[{title:"Regulatory Compliance",description:"QPs ensure that pharmaceutical products meet EU GMP guidelines and other global regulatory requirements."},{title:"Batch Release & Certification",description:"They certify and release medicinal products for the EU market, ensuring quality and safety."},{title:"Audits & Inspections",description:"QPs conduct audits of API/formulation processes, contract manufacturing organizations (CMOs), and third-party suppliers."},{title:"Risk Management & Quality Systems",description:"They help implement quality systems, manage risks, and assess suppliers."},{title:"Importation & Distribution",description:"Some QP services also oversee the importation, storage, and distribution of medicines, ensuring compliance with Good Manufacturing Practice (GMP)."}]},qo={title:"How and Where",items:["ABBESS Healthcare has its first Research and Development unit at Navi Mumbai, Maharashtra India.","It’s a full-fledged facility for research and formulation development of OSD which include tablets, capsules, sachets, granules and OSD effervescent formula
